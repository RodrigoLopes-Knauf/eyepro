# Exemplo de configuração Nginx para Proxy Reverso com SSL e WebSockets
# Substitua remote.seu-dominio.com pelo seu domínio real

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name remote.seu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name remote.seu-dominio.com;

    # Certificados SSL (ex: Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/remote.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.seu-dominio.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeçalhos de Segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Limite de tamanho de upload/frames
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        
        # Suporte completo a WebSockets em tempo real
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desativa buffering para latência ultra-baixa de streaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
