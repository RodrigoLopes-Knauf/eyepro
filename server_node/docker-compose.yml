version: '3.8'

# ========================================================
# DataGate Remote Live - Servidor VPS (Coolify / Docker)
# ========================================================

services:
  remote-relay:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - WORKER_SECRET=${WORKER_SECRET:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
